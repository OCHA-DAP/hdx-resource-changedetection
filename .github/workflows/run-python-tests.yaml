# This workflow will install Python dependencies, lint and run tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run tests

on:
  workflow_dispatch: # add run button in github
  push:
    branches-ignore:
      - gh-pages
      - 'dependabot/**'
  pull_request:
    branches-ignore:
      - gh-pages

concurrency:
  group: ${{ github.head_ref || github.ref_name }}


jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Install Hatch
      uses: pypa/hatch@install
    - name: Test with hatch/pytest
      run: |
        hatch test
    - name: Check styling
      if: always()
      run: |
        hatch fmt --check
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        junit_files: test-results.xml
    - name: Publish in Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: tests
        format: lcov


name: Run tests

on:
  workflow_dispatch:
  push:
    branches-ignore: [gh-pages, "dependabot/**"]
  pull_request:
    branches-ignore: [gh-pages]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check styling
        run: |
          uv run ruff format --check
          uv run ruff check

      - name: Test with pytest
        env:
          HDX_KEY_TEST: ${{ secrets.HDX_BOT_SCRAPERS_API_TOKEN }}
          GSHEET_AUTH: ${{ secrets.HDX_PIPELINE_GSHEET_AUTH }}
        run: uv run pytest

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

      - name: Publish in Coveralls
        uses: coverallsapp/github-action@v2
        if: always()
        with:
          flag-name: tests
          format: lcov
